services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-dt_smart_farming_local}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_farming_digital_twin}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - smart_farming_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dt_smart_farming_local}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_farming_digital_twin}
      APP_HOST: 0.0.0.0
      PORT: 5000
      FLASK_DEBUG: 0
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-local-compose-only-change-before-sharing}
      MODEL_PATH: models/predictive_models.joblib
    volumes:
      - ./uploads:/app/uploads
      - ./data/regional:/app/data/regional
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 120s

volumes:
  smart_farming_mysql_data:
